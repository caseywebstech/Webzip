<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web2Zip | Secure Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body{background:#0d0d12;color:#00ff88;font-family:'JetBrains Mono',monospace;background-image:linear-gradient(rgba(0,255,136,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.03) 1px,transparent 1px);background-size:30px 30px}.box{border:2px solid #00ff88;box-shadow:5px 5px 0 #7000ff}.input{background:#050509;border:1px solid #7000ff;color:#fff}.input:focus{border-color:#00ff88;outline:none}.btn{background:#00ff88;color:#000}.oauth{border:1px solid #333;color:#fff}.oauth:hover{border-color:#00ff88}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">
<div class="box bg-[#16161e] w-full max-w-md p-8">
<p class="text-[10px] opacity-50 text-right">WEB2ZIP // SECURE ACCESS</p>
<h1 class="text-3xl font-bold mt-4">LOGIN <span class="text-[#7000ff]">PROTOCOL</span></h1>
<p class="text-xs text-gray-500 mt-2">Authenticate to access the extraction tools.</p>
<div id="message" class="hidden mt-5 p-3 border border-red-700 text-red-400 text-xs"></div>
<form id="loginForm" class="mt-6 space-y-4">
<label class="block text-xs">EMAIL<input id="email" type="email" required autocomplete="email" class="input w-full p-3 mt-2" placeholder="you@example.com"></label>
<label class="block text-xs">PASSWORD<input id="password" type="password" required autocomplete="current-password" class="input w-full p-3 mt-2" placeholder="••••••••"></label>
<button id="submit" class="btn w-full p-4 font-bold tracking-widest" type="submit">SIGN IN</button>
</form>
<div class="flex items-center gap-3 my-6"><div class="h-px bg-gray-800 flex-1"></div><span class="text-[10px] text-gray-600">OR</span><div class="h-px bg-gray-800 flex-1"></div></div>
<div class="grid grid-cols-2 gap-3"><a class="oauth p-3 text-center text-xs" href="/auth/google">Google</a><a class="oauth p-3 text-center text-xs" href="/auth/github">GitHub</a></div>
<p class="text-xs text-gray-500 mt-6 text-center">New here? <a href="/register" class="text-[#00ff88]">Create an account</a></p><p class="text-[9px] text-gray-600 mt-3 text-center">Google/GitHub require OAuth credentials configured in your hosting environment.</p>
</div>
<script>
const msg=document.getElementById('message');
function show(text){msg.textContent=text;msg.classList.remove('hidden')}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg.classList.add('hidden');const b=document.getElementById('submit');b.disabled=true;b.textContent='AUTHENTICATING...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,redirect:'/'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');location.href=d.redirect||'/'}catch(err){show(err.message)}finally{b.disabled=false;b.textContent='SIGN IN'}});
</script>
</body></html>
