<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Protocol · Caseyrhodes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- reset & base (dark, no glow) --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #060a0e;
      color: #b0bec5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* --- dark animated lines (background) --- */
    #lines-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.25;
    }

    /* --- main card (darker, no glow) --- */
    .cyber-card {
      position: relative;
      z-index: 10;
      background: #0a0f14;
      width: 100%;
      max-width: 540px;
      padding: 2rem 2rem 1.8rem;
      border-radius: 1.5rem 0.8rem 1.5rem 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.035);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: all 0.2s;
    }

    /* --- profile picture (centre, no glow) --- */
    .profile-wrapper {
      display: flex;
      justify-content: center;
      margin-top: -3.8rem;
      margin-bottom: 1.2rem;
    }
    .profile-pic {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #0d131a;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: 0.2s;
    }
    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .profile-pic:hover {
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* --- title (muted) --- */
    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #90a4ae;
      text-shadow: none;
      line-height: 1.15;
    }
    .brand-title .highlight {
      color: #546e7a;
    }
    .brand-sub {
      font-size: 0.65rem;
      letter-spacing: 2.5px;
      color: #546e7a;
      border-left: 2px solid rgba(255, 255, 255, 0.04);
      padding-left: 10px;
      margin-top: 4px;
    }

    /* --- inputs & elements (dark, flat) --- */
    .tech-input {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #b0bec5;
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      width: 100%;
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .tech-input:focus {
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.025);
    }
    .tech-input::placeholder {
      color: #37474f;
      font-weight: 400;
    }

    .btn-execute {
      background: #1a232c;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 40px;
      padding: 0.9rem 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #90a4ae;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: 0.2s;
      cursor: pointer;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }
    .btn-execute:hover {
      background: #26333e;
      color: #b0bec5;
      border-color: rgba(255, 255, 255, 0.06);
    }
    .btn-execute:active {
      transform: scale(0.98);
    }

    .status-box {
      background: rgba(255, 255, 255, 0.015);
      border-left: 2px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 0.7rem 1rem;
    }

    /* --- toggle switch (dark, flat) --- */
    .toggle-checkbox:checked + .toggle-slider {
      background: #26333e;
    }
    .toggle-slider {
      background: rgba(255, 255, 255, 0.04);
      transition: 0.2s;
      border-radius: 999px;
      width: 40px;
      height: 22px;
      position: relative;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.035);
    }
    .toggle-slider::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #546e7a;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle-checkbox:checked + .toggle-slider::after {
      transform: translateX(18px);
      background: #78909c;
    }
    .toggle-checkbox {
      display: none;
    }

    /* --- code block --- */
    .code-block {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.025);
      border-radius: 10px;
      padding: 0.5rem 0.8rem;
      font-size: 0.6rem;
      color: #546e7a;
      word-break: break-all;
      font-family: 'JetBrains Mono', monospace;
    }
    .code-block span {
      color: #78909c;
    }

    /* --- footer --- */
    .footer-brand {
      font-size: 0.7rem;
      letter-spacing: 0.2px;
      color: #455a64;
      border-top: 1px solid rgba(255, 255, 255, 0.025);
      padding-top: 1rem;
      margin-top: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-brand strong {
      font-weight: 700;
      color: #78909c;
      font-weight: 700;
    }

    /* --- glass cards (dark, flat) --- */
    .glass-card {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.025);
      border-radius: 14px;
      padding: 0.8rem 1.1rem;
    }

    /* --- responsive --- */
    @media (max-width: 480px) {
      .cyber-card { padding: 1.5rem 1.2rem 1.5rem; }
      .profile-pic { width: 74px; height: 74px; margin-top: -2.8rem; }
    }

    /* --- scrollbar dark --- */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #26333e; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- animated lines background (very subtle) -->
  <canvas id="lines-canvas"></canvas>

  <!-- main card -->
  <div class="cyber-card">

    <!-- profile picture -->
    <div class="profile-wrapper">
      <div class="profile-pic">
        <img src="https://url.bmbxmd.workers.dev/QF65C.jpg" alt="profile" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-size:2.4rem;color:#546e7a;\'>CR</span>'">
      </div>
    </div>

    <!-- header -->
    <div class="text-center mb-4">
      <h1 class="brand-title">SCRAPE <span class="highlight">PROTOCOL</span></h1>
      <div class="brand-sub">⚡ HYBRID · RENDER  ⚡</div>
    </div>

    <!-- url input -->
    <div class="mb-4">
      <label class="text-[0.55rem] tracking-[0.15em] text-[#455a64] font-bold uppercase block mb-1.5">Target URL</label>
      <input type="text" id="urlInput" 
             class="tech-input" 
             placeholder="https://example.com" value="https://">
    </div>

    <!-- advanced toggle -->
    <div class="glass-card flex items-center justify-between mb-4">
      <div>
        <p class="text-sm font-bold text-[#78909c] tracking-wide">Advanced Mode</p>
        <p class="text-[0.5rem] text-[#455a64] italic">client‑side render · bypass 403</p>
      </div>
      <label class="relative flex items-center">
        <input type="checkbox" id="advancedMode" class="toggle-checkbox">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- API endpoint -->
    <div class="glass-card mb-5">
      <div class="flex justify-between items-center mb-1.5">
        <span class="text-[0.5rem] font-bold text-[#455a64] tracking-widest">SYSTEM API</span>
        <span class="text-[0.45rem] bg-[rgba(255,255,255,0.02)] text-[#546e7a] px-2 py-0.5 rounded-full border border-[rgba(255,255,255,0.025)]">GET</span>
      </div>
      <div class="code-block select-all">
        /api/convert?url=<span>{TARGET_URL}</span>
      </div>
    </div>

    <!-- execute button -->
    <button onclick="runScraper()" id="runBtn" class="btn-execute">
      ⚡ Execute Extraction
    </button>

    <!-- log -->
    <div id="sysLog" class="status-box mt-5 hidden">
      <div id="logContent" class="text-[0.65rem] space-y-1 max-h-32 overflow-y-auto">
        <p class="text-[#546e7a]">> Initializing scraper...</p>
      </div>
    </div>

    <!-- footer -->
    <div class="footer-brand">
      <span>✦ <strong>Proudly made by Caseyrhodes Tech</strong> ✦</span>
      <span class="text-[0.45rem] bg-[rgba(255,255,255,0.015)] px-3 py-1 rounded-full text-[#455a64] border border-[rgba(255,255,255,0.02)]">READY</span>
    </div>
  </div>

  <!-- hidden iframe for advanced rendering -->
  <iframe id="renderFrame" style="display:none;"></iframe>

  <script>
    // ——— animated lines (very subtle, dark) ———
    (function initLines() {
      const canvas = document.getElementById('lines-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const lines = [];
      const LINE_COUNT = 18;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class MovingLine {
        constructor() {
          this.reset();
        }
        reset() {
          this.x1 = Math.random() * w;
          this.y1 = Math.random() * h;
          this.x2 = Math.random() * w;
          this.y2 = Math.random() * h;
          this.speed = 0.08 + Math.random() * 0.12;
          this.angle = Math.random() * Math.PI * 2;
          this.length = 40 + Math.random() * 80;
          this.opacity = 0.01 + Math.random() * 0.025;
          this.color = `rgba(255, 255, 255, ${this.opacity})`;
          this.dx = Math.cos(this.angle) * this.speed;
          this.dy = Math.sin(this.angle) * this.speed;
        }
        update() {
          this.x1 += this.dx;
          this.y1 += this.dy;
          this.x2 += this.dx;
          this.y2 += this.dy;
          if (this.x1 < -50) { this.x1 = w + 50; this.x2 = this.x1 + this.length * 0.6; }
          if (this.x1 > w + 50) { this.x1 = -50; this.x2 = this.x1 - this.length * 0.6; }
          if (this.y1 < -50) { this.y1 = h + 50; this.y2 = this.y1 + this.length * 0.4; }
          if (this.y1 > h + 50) { this.y1 = -50; this.y2 = this.y1 - this.length * 0.4; }
          const dx = this.x2 - this.x1;
          const dy = this.y2 - this.y1;
          const dist = Math.hypot(dx, dy);
          if (dist > 0) {
            this.x2 = this.x1 + (dx / dist) * this.length;
            this.y2 = this.y1 + (dy / dist) * this.length;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.moveTo(this.x1, this.y1);
          ctx.lineTo(this.x2, this.y2);
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }

      for (let i = 0; i < LINE_COUNT; i++) {
        lines.push(new MovingLine());
      }

      function drawLines() {
        ctx.clearRect(0, 0, w, h);
        for (let line of lines) {
          line.update();
          line.draw();
        }
        requestAnimationFrame(drawLines);
      }
      drawLines();
    })();

    // ——— scraper logic (unchanged) ———
    const log = (msg, color = "#546e7a") => {
      const container = document.getElementById('logContent');
      const p = document.createElement('p');
      p.style.color = color;
      p.innerText = `> ${msg}`;
      container.appendChild(p);
      container.scrollTop = container.scrollHeight;
    };

    async function runScraper() {
      const url = document.getElementById('urlInput').value.trim();
      const isAdvanced = document.getElementById('advancedMode').checked;
      if (!url || url === 'https://' || url === '') {
        alert('ERROR: URL_REQUIRED');
        return;
      }

      const logBox = document.getElementById('sysLog');
      logBox.classList.remove('hidden');
      document.getElementById('logContent').innerHTML = '';
      log('Initializing protocol ...');

      const btn = document.getElementById('runBtn');
      const originalText = btn.innerText;
      btn.innerText = '⚡ RUNNING ...';
      btn.disabled = true;

      if (isAdvanced) {
        await executeUserSideExtraction(url);
      } else {
        log('Executing server‑side scrape ...', '#455a64');
        window.location.href = `/api/convert?url=${encodeURIComponent(url)}`;
        setTimeout(() => {
          btn.innerText = originalText;
          btn.disabled = false;
        }, 5000);
        return;
      }

      btn.innerText = originalText;
      btn.disabled = false;
    }

    async function executeUserSideExtraction(targetUrl) {
      try {
        log('Engaging client‑side render engine ...', '#455a64');
        const zip = new JSZip();

        log('Fetching via stealth proxy ...', '#455a64');
        const proxyUrl = `/api/proxy?url=${encodeURIComponent(targetUrl)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error(`Server block (${response.status})`);
        const html = await response.text();

        log('Injecting render frame ...', '#455a64');
        const frame = document.getElementById('renderFrame');
        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        frameDoc.open();
        frameDoc.write(html);
        frameDoc.close();

        log('Waiting for React hydration (8s) ...', '#455a64');
        await new Promise(r => setTimeout(r, 8000));

        log('Capturing hydrated DOM ...', '#455a64');
        const renderedDoc = frameDoc.cloneNode(true);
        const assets = [];

        const process = (selector, attr, folder) => {
          renderedDoc.querySelectorAll(selector).forEach((el, i) => {
            const src = el.getAttribute(attr);
            if (src && !src.startsWith('data:') && !src.startsWith('#')) {
              try {
                const absUrl = new URL(src, targetUrl).href;
                const fileName = `file-${i}.${folder}`;
                assets.push({ url: absUrl, path: `${folder}/${fileName}` });
                el.setAttribute(attr, `./${folder}/${fileName}`);
              } catch (e) {}
            }
          });
        };

        process('link[rel="stylesheet"]', 'href', 'css');
        process('script[src]', 'src', 'js');
        process('img', 'src', 'img');

        zip.file("index.html", renderedDoc.documentElement.outerHTML);

        log(`Downloading assets (${assets.length}) ...`, '#455a64');
        for (const asset of assets) {
          try {
            const res = await fetch(`/api/proxy?url=${encodeURIComponent(asset.url)}`);
            if (res.ok) {
              const blob = await res.blob();
              zip.file(asset.path, blob);
            }
          } catch (e) {}
        }

        log('Packing ZIP archive ...', '#546e7a');
        const content = await zip.generateAsync({ type: "blob" });
        const zipName = new URL(targetUrl).hostname.replace(/\./g, '_') + '_advanced.zip';

        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = zipName;
        link.click();

        log('✅ Extraction complete!', '#78909c');
      } catch (err) {
        log(`❌ FAILED: ${err.message}`, '#6d4c41');
      }
    }
  </script>
</body>
</html>
