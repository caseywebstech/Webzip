<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Web2Zip | Secure Access</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{background:#0d0d12;background-image:linear-gradient(rgba(0,255,136,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.03) 1px,transparent 1px);background-size:30px 30px;font-family:'JetBrains Mono',monospace;color:#00ff88;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.anime-border{border:2px solid #00ff88;box-shadow:5px 5px 0 #7000ff;clip-path:polygon(0 0,100% 0,100% 95%,95% 100%,0 100%)}.tech-input{background:rgba(0,0,0,.7);border:1px solid #7000ff;color:#fff;outline:none}.tech-input:focus{border-color:#00ff88;box-shadow:0 0 10px rgba(0,255,136,.2)}.btn{font-weight:800;text-transform:uppercase;letter-spacing:2px;transition:.2s;cursor:pointer}.btn-green{background:#00ff88;color:#000}.btn-green:hover{background:#7000ff;color:#fff}.btn-purple{background:#7000ff;color:#fff}.btn-purple:hover{background:#00ff88;color:#000}.hiddenx{display:none!important}.status{border-left:3px solid #7000ff;background:rgba(112,0,255,.05)}
</style>
</head>
<body>
<div class="anime-border bg-[#16161e] w-full max-w-lg p-8 relative">
<div class="absolute top-2 right-4 text-[10px] opacity-50">VER 5.2.0 // SECURE_LOGIN</div>

<section id="loginView">
<h1 class="text-4xl font-black tracking-tighter">WEB2<span class="text-[#7000ff]">ZIP</span></h1>
<div class="h-1 w-20 bg-[#7000ff] mt-1 mb-8"></div>
<p class="text-[10px] mb-2 text-purple-400 font-bold tracking-widest">SECURE ACCESS</p>
<div class="space-y-4">
<input id="email" type="email" autocomplete="email" class="tech-input w-full p-4 rounded-sm" placeholder="EMAIL">
<input id="password" type="password" autocomplete="current-password" class="tech-input w-full p-4 rounded-sm" placeholder="PASSWORD">
<button id="loginBtn" onclick="login()" class="btn btn-green w-full p-4">Login with Email</button>
<div class="grid grid-cols-2 gap-3">
<button onclick="oauth('google')" class="btn btn-purple p-3">Google</button>
<button onclick="oauth('github')" class="btn btn-purple p-3">GitHub</button>
</div>
<p class="text-[9px] text-gray-500">Demo login defaults: admin@example.com / ChangeMe123! — change these in Render environment variables.</p>
<div id="loginError" class="text-red-400 text-[10px] hiddenx"></div>
</div>
</section>

<section id="appView" class="hiddenx">
<div class="flex justify-between items-start mb-8"><div><h1 class="text-4xl font-black tracking-tighter">SCRAPE <span class="text-[#7000ff]">PROTOCOL</span></h1><div class="h-1 w-20 bg-[#7000ff] mt-1"></div></div><button onclick="logout()" class="text-[9px] border border-gray-700 px-2 py-1 text-gray-400">LOGOUT</button></div>
<p id="userLabel" class="text-[9px] text-gray-500 mb-5"></p>
<div class="space-y-6">
<div><p class="text-[10px] mb-2 text-purple-400 font-bold tracking-widest">INPUT_TARGET_URL</p><input id="urlInput" type="text" class="tech-input w-full p-4 rounded-sm font-bold italic" placeholder="HTTPS://SOURCE-LINK.COM"></div>
<div class="flex items-center justify-between p-4 bg-black/40 border border-purple-900/30 rounded"><div><p class="text-[11px] font-bold text-white uppercase tracking-widest">Advanced Mode</p><p class="text-[9px] text-gray-500 italic">Automated User-Side Rendering.</p></div><label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="advancedMode" class="sr-only peer"><div class="w-11 h-6 bg-gray-700 rounded-full peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#7000ff]"></div></label></div>
<button onclick="runScraper()" id="runBtn" class="btn btn-green w-full p-5 italic">Execute Extraction</button>
</div>
<div id="sysLog" class="mt-8 status p-4 hiddenx"><div class="text-[11px] space-y-1" id="logContent"></div></div>
</section>
<iframe id="renderFrame" style="display:none"></iframe>
</div>
<script>
const $=id=>document.getElementById(id);const tokenKey='web2zip_token';
function log(msg,color='#00ff88'){const p=document.createElement('p');p.style.color=color;p.innerText='> '+msg;$('logContent').appendChild(p)}
async function login(){const email=$('email').value.trim(),password=$('password').value; $('loginError').classList.add('hiddenx');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'LOGIN_FAILED');localStorage.setItem(tokenKey,d.token);showApp(d.email)}catch(e){$('loginError').innerText=e.message;$('loginError').classList.remove('hiddenx')}}
function showApp(email){$('loginView').classList.add('hiddenx');$('appView').classList.remove('hiddenx');$('userLabel').innerText='AUTHENTICATED: '+email}
function logout(){localStorage.removeItem(tokenKey);location.reload()}
async function oauth(provider){const r=await fetch('/api/oauth/'+provider);const d=await r.json();alert(d.message||'OAuth is not configured yet.')}
async function authFetch(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+localStorage.getItem(tokenKey)};const r=await fetch(url,opts);if(r.status===401){logout();throw new Error('LOGIN_REQUIRED')}return r}
async function runScraper(){const url=$('urlInput').value.trim(),advanced=$('advancedMode').checked;if(!url)return alert('ERROR: URL_REQUIRED');$('sysLog').classList.remove('hiddenx');$('logContent').innerHTML='';$('runBtn').disabled=true;log('Initializing Protocol...');try{if(advanced){await advancedExtract(url)}else{log('Executing Server-Side Scrape...');const r=await authFetch('/api/convert?url='+encodeURIComponent(url));if(!r.ok)throw new Error('Extraction failed');const blob=await r.blob();downloadBlob(blob,new URL(url).hostname.replace(/\./g,'_')+'.zip');log('COMPLETE!')}}catch(e){log('FAILED: '+e.message,'red')}finally{$('runBtn').disabled=false}}
async function advancedExtract(target){log('Fetching Raw Code...','#7000ff');const r=await authFetch('/api/proxy?url='+encodeURIComponent(target));if(!r.ok)throw new Error('Proxy request failed');const html=await r.text();const frame=$('renderFrame'),doc=frame.contentDocument||frame.contentWindow.document;doc.open();doc.write(html);doc.close();log('Waiting for rendering...');await new Promise(x=>setTimeout(x,3000));const zip=new JSZip(),rendered=doc.documentElement.cloneNode(true),assets=[];function process(sel,attr,folder){rendered.querySelectorAll(sel).forEach((el,i)=>{const src=el.getAttribute(attr);if(src&&!src.startsWith('data:')&&!src.startsWith('#'))try{const u=new URL(src,target).href,n='file-'+i+'.'+folder;assets.push({url:u,path:folder+'/'+n});el.setAttribute(attr,'./'+folder+'/'+n)}catch(_){}})}process('link[rel="stylesheet"]','href','css');process('script[src]','src','js');process('img','src','img');zip.file('index.html',rendered.outerHTML);log('Downloading '+assets.length+' assets...');for(const a of assets){try{const x=await authFetch('/api/proxy?url='+encodeURIComponent(a.url));if(x.ok)zip.file(a.path,await x.blob())}catch(_){}}const blob=await zip.generateAsync({type:'blob'});downloadBlob(blob,new URL(target).hostname.replace(/\./g,'_')+'_advanced.zip');log('COMPLETE!')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
(function(){const t=localStorage.getItem(tokenKey);if(!t)return;fetch('/api/me',{headers:{Authorization:'Bearer '+t}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>showApp(d.email)).catch(()=>localStorage.removeItem(tokenKey))})();
</script>
</body></html>
