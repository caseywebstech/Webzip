<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web2Zip | Cyber Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d12;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'JetBrains Mono', monospace;
            color: #00ff88;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto; 
            padding: 20px;
        }

        .anime-border {
            border: 2px solid #00ff88;
            box-shadow: 5px 5px 0px #7000ff;
            clip-path: polygon(0% 0%, 100% 0%, 100% 95%, 95% 100%, 0% 100%);
        }

        .tech-input {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #7000ff;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        .tech-input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .btn-execute {
            background: #00ff88;
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-execute:hover {
            background: #7000ff;
            color: #fff;
            box-shadow: 0 0 20px #7000ff;
        }

        .glitch-text {
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .status-box {
            border-left: 3px solid #7000ff;
            background: rgba(112, 0, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="anime-border bg-[#16161e] w-full max-w-lg p-8 relative">
        <div class="absolute top-2 right-4 text-[10px] opacity-50">VER 5.1.0 // HYBRID_RESTORED</div>
        
        <div class="mb-8">
            <h1 class="text-4xl font-black glitch-text tracking-tighter">
                SCRAPE <span class="text-[#7000ff]">PROTOCOL</span>
            </h1>
            <div class="h-1 w-20 bg-[#7000ff] mt-1"></div>
        </div>

        <div class="space-y-6">
            <div>
                <p class="text-[10px] mb-2 text-purple-400 font-bold tracking-widest">INPUT_TARGET_URL</p>
                <input type="text" id="urlInput" 
                    class="tech-input w-full p-4 rounded-sm font-bold italic"
                    placeholder="HTTP://SOURCE_LINK.COM" value="https://">
            </div>

            <div class="flex items-center justify-between p-4 bg-black/40 border border-purple-900/30 rounded">
                <div>
                    <p class="text-[11px] font-bold text-white uppercase tracking-widest">Advanced Mode</p>
                    <p class="text-[9px] text-gray-500 italic">Automated User-Side Rendering (Bypasses 403/React).</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="advancedMode" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#7000ff] shadow-[0_0_10px_rgba(112,0,255,0.4)]"></div>
                </label>
            </div>

            <div class="p-4 bg-black/40 border border-[#00ff88]/30 rounded">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-[10px] font-bold text-[#00ff88] uppercase tracking-widest">System API Endpoint</p>
                    <span class="text-[8px] bg-[#00ff88] text-black px-1.5 py-0.5 rounded-sm font-bold">GET</span>
                </div>
                <code class="block text-[10px] text-gray-400 break-all p-2 bg-black border border-[#7000ff]/30 rounded select-all selection:bg-[#7000ff] selection:text-white">
                    /api/convert?url={<span class="text-white">TARGET_URL</span>}
                </code>
            </div>
            <button onclick="runScraper()" id="runBtn" class="btn-execute w-full p-5 italic">
                Execute Extraction
            </button>
        </div>

        <div id="resultBox" class="mt-6 p-4 bg-black/50 border border-[#00ff88]/40 rounded hidden">
            <p class="text-[10px] font-bold text-[#00ff88] uppercase tracking-widest mb-3">DOWNLOAD / COPY OPTIONS</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <button id="downloadZipBtn" type="button" class="p-3 bg-[#00ff88] text-black font-bold text-[10px] uppercase tracking-wider rounded hover:bg-white transition">
                    Download ZIP
                </button>
                <button id="downloadCodeBtn" type="button" class="p-3 bg-[#7000ff] text-white font-bold text-[10px] uppercase tracking-wider rounded hover:bg-white hover:text-black transition">
                    Download Code
                </button>
                <button id="copyCodeBtn" type="button" class="p-3 bg-gray-800 text-white border border-gray-600 font-bold text-[10px] uppercase tracking-wider rounded hover:border-[#00ff88] transition">
                    Copy Code
                </button>
            </div>
            <p id="copyStatus" class="text-[9px] text-gray-500 mt-3 hidden"></p>
        </div>

        <div id="sysLog" class="mt-8 status-box p-4 hidden">
            <div class="text-[11px] space-y-1" id="logContent">
                <p>> Initializing Scraper...</p>
            </div>
        </div>

        <div class="mt-10 pt-6 border-t border-gray-800 flex justify-between items-end">
            <div>
                <p class="text-[9px] text-gray-500 uppercase">Tech Authority</p>
                <p class="text-xs font-bold text-white tracking-widest">LORD INDUMINA</p>
            </div>
            <div class="text-[10px] bg-[#7000ff] text-white px-2 py-1">READY</div>
        </div>
    </div>

    <iframe id="renderFrame" style="display:none;"></iframe>

    <script>
        const log = (msg, color = "#00ff88") => {
            const p = document.createElement('p');
            p.style.color = color;
            p.innerText = `> ${msg}`;
            const container = document.getElementById('logContent');
            container.appendChild(p);
            container.scrollTop = container.scrollHeight;
        };

        let currentZipBlob = null;
        let currentCode = '';
        let currentCodeName = 'index.html';

        function showResultOptions(zipBlob, code, codeName = 'index.html') {
            currentZipBlob = zipBlob || null;
            currentCode = code || '';
            currentCodeName = codeName || 'index.html';
            document.getElementById('resultBox').classList.remove('hidden');
        }

        function downloadBlob(blob, filename) {
            if (!blob) return;
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        }

        document.getElementById('downloadZipBtn').addEventListener('click', () => {
            downloadBlob(currentZipBlob, currentZipBlob?.name || 'website.zip');
        });

        document.getElementById('downloadCodeBtn').addEventListener('click', () => {
            if (!currentCode) return;
            downloadBlob(new Blob([currentCode], { type: 'text/html;charset=utf-8' }), currentCodeName);
        });

        document.getElementById('copyCodeBtn').addEventListener('click', async () => {
            if (!currentCode) return;
            const status = document.getElementById('copyStatus');
            try {
                await navigator.clipboard.writeText(currentCode);
                status.textContent = 'CODE COPIED TO CLIPBOARD';
                status.classList.remove('hidden');
            } catch (error) {
                const area = document.createElement('textarea');
                area.value = currentCode;
                area.style.position = 'fixed';
                area.style.opacity = '0';
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                status.textContent = 'CODE COPIED TO CLIPBOARD';
                status.classList.remove('hidden');
            }
        });

        async function runScraper() {
            const url = document.getElementById('urlInput').value.trim();
            const isAdvanced = document.getElementById('advancedMode').checked;
            if (!url || url === 'https://') return alert('ERROR: URL_REQUIRED');

            document.getElementById('sysLog').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('logContent').innerHTML = '';
            currentZipBlob = null;
            currentCode = '';
            log('Initializing Protocol...');

            const btn = document.getElementById('runBtn');
            btn.innerText = 'RUNNING...';
            btn.disabled = true;

            try {
                if (isAdvanced) {
                    await executeUserSideExtraction(url);
                } else {
                    log('Executing Server-Side Scrape...');
                    const response = await fetch(`/api/convert?url=${encodeURIComponent(url)}`);
                    if (!response.ok) {
                        const message = await response.text();
                        throw new Error(message || `Server returned ${response.status}`);
                    }
                    const zipBlob = await response.blob();
                    const codeResponse = await fetch(`/api/code?url=${encodeURIComponent(url)}`);
                    const code = codeResponse.ok ? await codeResponse.text() : '';
                    const hostname = new URL(url.startsWith('http') ? url : `https://${url}`).hostname.replace(/^www\./, '').replace(/\./g, '_');
                    zipBlob.name = `${hostname}.zip`;
                    showResultOptions(zipBlob, code, `${hostname}.html`);
                    log('COMPLETE! Download or copy the extracted code below.', '#00ff88');
                }
            } catch (err) {
                log(`FAILED: ${err.message}`, 'red');
            } finally {
                btn.innerText = 'Execute Extraction';
                btn.disabled = false;
            }
        }

        async function executeUserSideExtraction(targetUrl) {
            try {
                log("Engaging User-Side Rendering Engine...", "#7000ff");
                const zip = new JSZip();
                
                log("Fetching Raw Code via Stealth Proxy...");
                const proxyUrl = `/api/proxy?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Server Blocked (403)");
                const html = await response.text();

                log("Injecting Render Chamber...");
                const frame = document.getElementById('renderFrame');
                const frameDoc = frame.contentDocument || frame.contentWindow.document;
                frameDoc.open();
                frameDoc.write(html);
                frameDoc.close();

                log("Waiting for React Hydration (8s)...");
                await new Promise(r => setTimeout(r, 8000));

                log("Capturing Hydrated DOM...");
                const renderedDoc = frameDoc.cloneNode(true);
                const assets = [];
                
                const process = (selector, attr, folder) => {
                    renderedDoc.querySelectorAll(selector).forEach((el, i) => {
                        const src = el.getAttribute(attr);
                        if (src && !src.startsWith('data:') && !src.startsWith('#')) {
                            try {
                                const absUrl = new URL(src, targetUrl).href;
                                const fileName = `file-${i}.${folder}`;
                                assets.push({ url: absUrl, path: `${folder}/${fileName}` });
                                el.setAttribute(attr, `./${folder}/${fileName}`);
                            } catch (e) {}
                        }
                    });
                };

                process('link[rel="stylesheet"]', 'href', 'css');
                process('script[src]', 'src', 'js');
                process('img', 'src', 'img');

                zip.file("index.html", renderedDoc.documentElement.outerHTML);

                log(`Downloading Assets (${assets.length})...`);
                for (const asset of assets) {
                    try {
                        const res = await fetch(`/api/proxy?url=${encodeURIComponent(asset.url)}`);
                        if (res.ok) {
                            const blob = await res.blob();
                            zip.file(asset.path, blob);
                        }
                    } catch (e) {}
                }

                log("Packaging Final ZIP...", "#00ff88");
                const content = await zip.generateAsync({ type: "blob" });
                const zipName = new URL(targetUrl).hostname.replace(/\./g, '_') + "_advanced.zip";
                content.name = zipName;
                const code = renderedDoc.documentElement.outerHTML;
                showResultOptions(content, code, 'index.html');

                log("COMPLETE! Download or copy the rendered code below.", "#00ff88");
            } catch (err) {
                log(`FAILED: ${err.message}`, "red");
            }
        }
    </script>
</body>
</html>
